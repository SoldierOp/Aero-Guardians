<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4D3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Logo (centered, larger) -->
  <g transform="translate(350, 200)">
    <circle cx="100" cy="100" r="95" fill="#0d3b2e" stroke="#52b788" stroke-width="3"/>
    
    <!-- Tree -->
    <g transform="translate(100, 85)">
      <rect x="-8" y="20" width="16" height="35" fill="#8B4513" rx="2"/>
      <path d="M 0,-40 L -35,10 L 35,10 Z" fill="#52b788"/>
      <path d="M 0,-30 L -30,15 L 30,15 Z" fill="#74c69d"/>
      <path d="M 0,-20 L -25,20 L 25,20 Z" fill="#95d5b2"/>
    </g>
    
    <!-- Shield -->
    <path d="M 100,30 L 140,50 L 140,90 Q 140,130 100,150 Q 60,130 60,90 L 60,50 Z" 
          fill="none" stroke="#F39C12" stroke-width="3" opacity="0.7"/>
    
    <!-- Flame -->
    <g transform="translate(130, 65)" opacity="0.8">
      <path d="M 0,-8 Q -3,-5 -3,0 Q -3,4 0,6 Q 3,4 3,0 Q 3,-5 0,-8 Z" fill="#E74C3C"/>
      <path d="M 0,-6 Q -1.5,-4 -1.5,0 Q -1.5,2 0,3 Q 1.5,2 1.5,0 Q 1.5,-4 0,-6 Z" fill="#F39C12"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="#95d5b2" text-anchor="start">PeatGuard Pro</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" 
        fill="#b7e4c7" text-anchor="start">Detecting Peat Fires 24 Hours Before Ignition</text>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="24" 
        fill="#74c69d" text-anchor="start">AI-Powered Early Warning System for Indonesia</text>
</svg>
