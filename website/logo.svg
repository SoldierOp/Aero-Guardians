<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1B4D3E" stroke="#2d6a4f" stroke-width="3"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#52b788" stroke-width="2" opacity="0.3"/>
  
  <!-- Tree symbol (stylized) -->
  <g transform="translate(100, 85)">
    <!-- Tree trunk -->
    <rect x="-8" y="20" width="16" height="35" fill="#8B4513" rx="2"/>
    
    <!-- Tree foliage - layered triangles -->
    <path d="M 0,-40 L -35,10 L 35,10 Z" fill="#52b788"/>
    <path d="M 0,-30 L -30,15 L 30,15 Z" fill="#74c69d"/>
    <path d="M 0,-20 L -25,20 L 25,20 Z" fill="#95d5b2"/>
  </g>
  
  <!-- Shield overlay -->
  <path d="M 100,30 L 140,50 L 140,90 Q 140,130 100,150 Q 60,130 60,90 L 60,50 Z" 
        fill="none" stroke="#F39C12" stroke-width="3" opacity="0.7"/>
  
  <!-- Flame accent (small, subtle) -->
  <g transform="translate(130, 65)" opacity="0.8">
    <path d="M 0,-8 Q -3,-5 -3,0 Q -3,4 0,6 Q 3,4 3,0 Q 3,-5 0,-8 Z" fill="#E74C3C"/>
    <path d="M 0,-6 Q -1.5,-4 -1.5,0 Q -1.5,2 0,3 Q 1.5,2 1.5,0 Q 1.5,-4 0,-6 Z" fill="#F39C12"/>
  </g>
  
  <!-- IoT dots (sensor network) -->
  <circle cx="70" cy="140" r="3" fill="#52b788" opacity="0.6"/>
  <circle cx="100" cy="145" r="3" fill="#52b788" opacity="0.6"/>
  <circle cx="130" cy="140" r="3" fill="#52b788" opacity="0.6"/>
  
  <!-- Connection lines -->
  <line x1="70" y1="140" x2="100" y2="145" stroke="#52b788" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="145" x2="130" y2="140" stroke="#52b788" stroke-width="1" opacity="0.4"/>
  
  <!-- Text arc at bottom -->
  <defs>
    <path id="textArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  </defs>
  <text fill="#95d5b2" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      PEATGUARD PRO
    </textPath>
  </text>
</svg>
